<!-- ===== v17: RECTA FINAL SIN VENTANAS. Cuando la tortuga lider va camino a la meta (desde RF % de pista) las ventanas emergentes no se muestran: la pista se ve completa. Quedan en espera (maximo 3, las mas recientes) y se muestran DESPUES, una a una, al terminar la carrera. Solo informa; nunca pide acciones (regla 1). ===== -->
<script id="recta-final-js">
(function(){
'use strict';
const safe=f=>{try{return f()}catch(e){return undefined}};
const RF=70;      /* % de pista del lider desde el que empieza la recta final (cambialo aqui) */
const GAP=3200;   /* ms entre una ventana diferida y la siguiente (cada una dura menos de 3 s) */
const MAXQ=3;
const $=id=>document.getElementById(id);
const app=$('app');if(!app||!safe(()=>S))return;
const prog=()=>Math.max(0,...(safe(()=>S.map(x=>x.p))||[0]));
const isOver=()=>!!safe(()=>over);
const gate=()=>!isOver()&&prog()>=RF;
const G=[];
document.querySelectorAll('#fxb span').forEach(el=>G.push({el,ms:1750}));
[['toast',2200],['gmGift',2600],['grChip',2600]].forEach(([id,ms])=>{const el=$(id);if(el)G.push({el,ms})});
const hy=$('hype');if(hy)G.push({el:hy,ms:2000,attr:'hidden'});
const vis=g=>g.attr?!g.el.hidden:g.el.classList.contains('on');
const hide=g=>{if(g.attr)g.el.hidden=true;else g.el.classList.remove('on','out')};
const D=[];let timers=[];
G.forEach(g=>{
 new MutationObserver(ms=>{
  const started=ms.some(m=>g.attr?(m.oldValue!==null&&vis(g)):(!(m.oldValue||'').split(/\s+/).includes('on')&&vis(g)));
  if(!started||!gate())return;
  const d={g,html:g.el.innerHTML,c:g.el.style.getPropertyValue('--c'),tc:g.el.style.getPropertyValue('--tc')};
  hide(g); /* se oculta antes de pintarse: la pista no se tapa */
  if(!D.some(x=>x.g===g&&x.html===d.html)){D.push(d);while(D.length>MAXQ)D.shift()}
 }).observe(g.el,{attributes:true,attributeFilter:[g.attr||'class'],attributeOldValue:true});
});
function show(d){
 const el=d.g.el;el.innerHTML=d.html;
 if(d.c)el.style.setProperty('--c',d.c);if(d.tc)el.style.setProperty('--tc',d.tc);
 if(d.g.attr){el.hidden=false}else{el.classList.remove('out');void el.offsetWidth;el.classList.add('on')}
 timers.push(setTimeout(()=>{
  if(d.g.attr){el.hidden=true;return}
  if(el.id==='gmGift'){el.classList.add('out');timers.push(setTimeout(()=>el.classList.remove('on','out'),400))}else el.classList.remove('on');
 },Math.min(d.g.ms,2600)));
}
function flush(){
 D.splice(0).forEach((d,i)=>timers.push(setTimeout(()=>{if(isOver())show(d)},i*GAP+400))); /* tras llegar a la meta */
}
const cancel=()=>{timers.forEach(clearTimeout);timers=[];D.length=0};
let wasOver=false;
setInterval(()=>{
 const o=isOver();
 app.classList.toggle('recta-final',gate());
 if(o&&!wasOver&&D.length)flush();
 if(!o&&wasOver)cancel(); /* ronda nueva: lo que quedo en espera ya es viejo */
 wasOver=o;
},150);
window.gamiRectaFinal={RF,queue:D};
})();
</script>

const _sp=SS.speak.bind(SS);
SS.speak=function(u){
 if(u&&(u._cp||!String(u.text||'').trim()))return _sp(u);
 if(u&&typeof u.onend==='function')setTimeout(()=>{try{u.onend()}catch(e){}},0); /* para que las colas viejas se vacien sin hablar */

 {id:'welcome',priority:3,ttlMs:25000,max:6,say:'Bienvenido {user}'}
];

 DEF_LEVELS[0],
 {id:'gift',priority:0,ttlMs:0,max:0,say:'Gracias {user} por enviar {count} {gift}.'},
 {id:'chat',priority:2,ttlMs:20000,max:3,maxChars:140,say:'{user} dice: {text}'},
 DEF_LEVELS[1],
 {id:'action',priority:3,ttlMs:12000,max:3,coalesceMs:8000,say:{like:'{user}, gracias por tus likes',follow:'Gracias {user} por seguirnos',share:'Gracias {user} por compartir'}},
 {id:'match',priority:4,ttlMs:8000,max:1,say:{start:'Se enfrentan {teamA} y {teamB}.'}}]};
fetch('/api/voice-priority').then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.levels)&&j.levels.length)TB={...TB,...j};if(j&&typeof j.donTortuEnabled==='boolean')window.setDonTortuEnabled(j.donTortuEnabled);ensureLevels();TB.enabledLevels=normalizeEnabledLevels(TB.enabledLevels);refreshPhraseExpiry()}).catch(()=>{});
function ensureLevels(){DEF_LEVELS.forEach(d=>{if(!TB.levels.some(l=>l.id===d.id))TB.levels.push(d)});
 TB.levels.forEach(l=>{if(l&&l.id==='gift')l.say='Gracias {user} por enviar {count} {gift}.'})}
ensureLevels();
function normalizeEnabledLevels(source){
 const enabledByDefault=new Set(['gift','move','chat','welcome','action','match']);
 return Object.fromEntries(TB.levels.map(level=>[
  level.id,
  typeof(source&&source[level.id])==='boolean'?source[level.id]:enabledByDefault.has(level.id)
 ]));

const LV=id=>TB.levels.find(l=>l.id===id)||{};
const levelEnabled=id=>!TB.enabledLevels||TB.enabledLevels[id]!==false;
const TRACK=()=>+TB.trackMeters||100;
window.getRaceTrackMeters=TRACK;
const fill=(s,o)=>String(s||'').replace(/\{(\w+)\}/g,(_,k)=>o[k]==null?'':o[k]);
/* 3) Voz y cola */

  if(direct)return direct;
  const key=String(username||'').toLowerCase();

   const cached=avatarUrlCache.get(key);if(https(cached))return cached;

   if(retries<2){

    return;
   }
   image.remove();target.textContent=initial;
   if(logFailure)console.warn('Honor: no cargo la foto de @'+record.username+' (¿firma vencida o bloqueada por el CDN?)');

 function remember(i,e){

 const record={eventId:String(e.eventId||''),teamId:team.id,teamName:team.n,username,displayName:String(e.displayName||username),
   avatarUrl:donorAvatar(e,username),
   giftName:String(e.giftName||e.gift_name||e.gift||''),giftDiamonds:Number(e.giftDiamonds)||0,
  activityCount:Math.max(1,Math.floor(Number(e.activityCount)||1)),receivedAt:Number(e.receivedAt)||Date.now()};
 state.teams[team.id]=record;
 saveSides();save();persistGift(record);render(i,true);
 }
 /* Solo guarda la atribucion del regalo que el motor asigno realmente a ese equipo. */
 let pending=null;
 if(typeof handleLiveEntry==='function'){const hle=handleLiveEntry;handleLiveEntry=function(e){
  const previous=pending,donation=e&&e.type==='gift'&&!e.bot&&e.username?{entry:e,team:-1}:null;
  if(donation)pending=donation;
  try{return hle.apply(this,arguments)}finally{
   if(donation&&donation.team>=0){try{remember(donation.team,donation.entry)}catch(error){console.error('No se pudo guardar el último donador del equipo.',error)}}
   pending=previous;
  }
 }}
 if(typeof push==='function'){const pu=push;push=function(i,type){const r=pu.apply(this,arguments);if(type==='gift'&&pending&&i>=0)pending.team=i;return r}}
 if(typeof reset==='function'){const rs=reset;reset=function(){const r=rs.apply(this,arguments);renderAll();return r}}
 renderAll();
})();
