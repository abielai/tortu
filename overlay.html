========================================================================================================
 REGLA GENERAL 0 - POLITICA DE TIKTOK SOBRE REGALOS (PRIORIDAD MAXIMA, PREVALECE SOBRE TODA OTRA REGLA)
========================================================================================================
 MOTIVO: TikTok suspendio la visibilidad del live por "solicitar regalos mediante acciones repetitivas,
 promesas enganosas, presion emocional o actos degradantes". Esta regla existe para que NO se repita.

 ALCANCE DE CUALQUIER CAMBIO EN ESTE ARCHIVO:
  - Modificar UNICAMENTE la interfaz y el comportamiento visual/sonoro/hablado del overlay.
  - BACKEND_README.txt es el CONTRATO del servidor: NO cambiar rutas, metodos HTTP, formatos de solicitud/respuesta,
    nombres de eventos SSE, claves de persistencia, la capa SRV ni la firma de despliegue.
  - NO inventar datos ni simular eventos. Conservar el contrato. No subir cambios al repositorio sin aprobacion.
  - Al terminar, informar: resumen de cambios + incompatibilidades o dudas encontradas.

 INSTRUCCION PARA CUALQUIER PROGRAMADOR O IA QUE MODIFIQUE ESTE ARCHIVO:
 Antes de agregar o cambiar cualquier texto, voz, sonido, animacion, cartel, boton o mecanica, verificar que
 cumpla TODO lo siguiente. Si algo no cumple, NO se implementa, y si ya existe, se elimina.

 A) PROHIBIDO PEDIR (en pantalla, en voz en off, en sonidos, en traducciones, en comentarios visibles):
    - Regalos, monedas, rosas, pistolas, capibaras, perfumes ni ningun regalo concreto.
    - Likes, "toca el live", "tap tap", "apoya", "dale", "manda", "envia", "sigue la cuenta" ni "comparte".
    - Pedir comentar o escribir el equipo como llamado a la accion ("escribe el nombre de tu equipo...").
    - Frases con tono de orden, ruego o insistencia, aunque sean amables o con humor.

 B) PROHIBIDO PROMETER O PREMIAR A CAMBIO DE REGALOS:
    - Ninguna frase, voz o cartel puede decir que un regalo da un beneficio ("entra en modo turbo",
      "tu foto queda en el cuadro de honor", "tu equipo gana ventaja", "avanza X %").
    - Los regalos NO deben dar ventaja de juego: ni avance directo, ni turbo, ni puntos, ni ranking, ni
      cuadro de honor. Un regalo real solo puede recibir un agradecimiento neutro ("Gracias {usuario}").
    - No mostrar catalogos, listas, carteles ni contadores que expliquen "que hace cada regalo" ni
      cuanto vale cada uno (sin pestana "Turbo regalos", sin carteles de rosa/pistola, sin contador de regalos).

 C) PROHIBIDO PRESION EMOCIONAL Y ACTOS DEGRADANTES:
    - Nada de culpa, urgencia falsa ("ultima oportunidad"), cuentas regresivas para forzar regalos, ni
      comparar o humillar a quien no regala. Nunca ridiculizar, castigar ni retar a nadie para que regale.

 D) PROHIBIDO REPETIR DE FORMA INSISTENTE:
    - Los avisos, voces y sonidos no deben repetirse en bucle ni en ciclos fijos para empujar una accion.
    - Maximo un agradecimiento por regalo real. Sin invitaciones periodicas de ninguna clase.

 E) LO UNICO PERMITIDO:
    - INFORMAR o REACCIONAR a eventos REALES ya ocurridos (alguien se unio, comento, dio like, siguio,
      compartio o envio un regalo), con agradecimiento neutro y sin pedir ni prometer nada.
    - Mostrar el estado de la pista (metros, posicion y avance por taps) sin vincularlo a regalos.
    - Sonidos y efectos (incluido 8 bit arcade) SOLO como reaccion a un evento real, nunca como estimulo
      para provocar una accion futura.

 F) COMPROBACION OBLIGATORIA ANTES DE ENTREGAR CUALQUIER CAMBIO:
    1) Buscar en TODO el archivo (incluida la tabla de traducciones ES/EN y las voces por prioridad) las

  FIRMA DE DESPLIEGUE (anti-cache). El HTML trae en el <head> la etiqueta  <meta name="cluss-deployment-signature" content="__CLUSS_DEPLOYMENT_SIGNATURE__">.
    El servidor debe REEMPLAZAR ese marcador por una firma con formato  sha256-<16 caracteres hex en minuscula>  (hash de la version desplegada) al servir el HTML,
    y devolver ESA MISMA firma en GET /api/deployment-signature como {"signature":"sha256-..."}.
    Se comprueba al cargar y antes de cada carrera. Si no coinciden, el frontend pausa la carrera, borra la cache y recarga UNA vez con ?_cluss_deploy=<firma>; si sigue distinta no insiste.
    Si el marcador no se reemplaza o el formato no es valido, el frontend no puede verificar la version (solo avisa en consola).
  GAME-TOOLS SSE (GET /api/game-tools/events), eventos con data JSON:

    voice-config   {repeatCooldownMinutes,donTortuEnabled,enabledLevels}   tiempo de antirrepeticion, estado de Don Tortu y niveles activos.
    game-command   {command}                               valores que el frontend entiende: 'refresh' (recarga la pagina), 'turbo-down', 'turbo-up'. El servidor solo debe enviar los de su lista permitida.
  HEARTBEAT (POST /api/game-tools/overlay-heartbeat): cada 20 s, al cambiar la visibilidad de la pestana y al cerrar (visible:false, keepalive). clientId = UUID generado por el overlay. Activo = senal visible en los ultimos 90 s.

 PARTE 3 - REGLAS DE JUEGO: QUIEN HACE QUE (backend vs frontend)
========================================================================================================
 11b. REGLAS DE JUEGO: QUIEN HACE QUE (backend vs frontend). Resumen para quien programa el SERVIDOR. Regla de oro: el backend ENVIA eventos reales y GUARDA datos; el frontend CALCULA puntajes, equipos, carreras y ganadores.
  CUENTA Y CONEXION
   - Backend: el usuario guardado desde el panel prevalece; si no hay ninguno usa TIKTOK_USERNAME y luego d4n1el325. Al guardar se quitan espacios y @; NO se acepta usuario vacio. Conecta al cargar el overlay o cuando el panel pide reconexion (POST /api/reconnect).
   - Frontend: muestra el estado recibido por SSE (event: status). Si falla la conexion puede pedir reconexion.
  REINTENTOS
   - Backend: cada intento espera hasta 10 s para conectar; reintenta cada 5 s durante un maximo de 5 min; despues queda en estado 'failed' hasta reiniciar el ciclo.
   - Frontend: solo refleja el estado; NO decide la politica de reintentos.
  EVENTOS ACEPTADOS
   - Backend: normaliza los eventos de TikTok y envia SOLO member, chat, gift, like, follow y share. Deduplica IDs de origen recientes y calcula el delta de los combos de regalos para no contar repetidos.
   - Frontend: solo procesa esos 6 tipos. Los bots estan desactivados en el juego actual; solo los eventos reales determinan la actividad.
  TAPS Y ACTIVIDAD
   - Backend: conserva tal cual los conteos de actividad (activityCount) que llegan del conector para regalos y likes.
   - Frontend: pesos por evento = ingreso (member) 1, comentario 10, like 1 por cada like, seguir 3, compartir 5. Los REGALOS NO suman taps: avanzan la pista directamente. Los comentarios repetidos del mismo usuario se limitan a uno cada 8 s. (OJO: los valores de las estadisticas por VS de la regla 18 son otra cosa: miembro 1, comentario 5, like 1, seguir 3, compartir 3, regalo 10.)
  AVANCE Y TURBO
   - Backend: guarda los avances configurables; acepta valores entre 0 y 100 %. Predeterminados en codigo: regalo 6 %, cada limite de taps 20 %.
   - Frontend: cada regalo contado da 10 % de avance directo y activa turbo 15 s por regalo. El contador de taps se mantiene fijo en 45 por equipo y al completarlo avanza directamente el porcentaje configurado, sin activar turbo.
  ASIGNACION AL EQUIPO
   - Backend: NO decide puntajes ni ganador.
   - Frontend: los eventos de una persona van a su equipo elegido/asignado; los eventos anonimos (sin username) usan el carril seleccionado. Un regalo toma el equipo que el usuario nombro en el chat en los ultimos 60 s, si lo hay (si no, el que tiene asignado).
  CARRERAS Y TORNEOS
   - Backend: persiste los documentos de estado del overlay, pero NO calcula el cuadro ni decide resultados.
   - Frontend: modos: Torneo Libre, Clasico, Libertadores, Champions, Copa del Mundo, Copa America y Elite Nations Cup. El Clasico empieza con Olimpia-Cerro y sus series son al mejor de 3; los demas cuadros son eliminacion directa con un partido por cruce.
  TORNEO LIBRE
   - Backend: la API separada de Torneo Libre registra los votos de comentarios recibidos mientras estaba habilitada; acepta nombres libres de equipos y cuenta usuarios UNICOS mediante huellas hash (no guarda el nombre).
   - Frontend: en este modo los comentarios reales que mencionan equipos votan por la SIGUIENTE carrera; juegan los dos mas votados y se sortean los puestos que falten. No se vota por los equipos que ya estan corriendo.
  INACTIVIDAD Y COPAS
   - Backend: puede registrar la copa comunicada por el frontend, solo si el codigo de pais es valido.
   - Frontend: la inactividad se mide desde la ultima interaccion REAL: 60 s, o 120 s si hubo mas de 1.000 interacciones. Los ingresos (member) NO reinician el reloj. Si vence, gana quien va primero y avanza, pero NO recibe copa.
  ESTADISTICAS POR PAIS
   - Backend: mantiene conteos de comentarios y copas para 21 paises/equipos. Reconoce nombre, codigo o bandera; los comentarios sin coincidencia quedan como 'sin pais'.
   - Frontend: envia los comentarios pendientes al completar la ronda. El panel del backend muestra los conteos recibidos.
  USUARIOS RECIENTES
   - Backend: conserva como maximo 4 usuarios registrados por eventos reales de ingreso (member) y puede actualizar sus avatares. NO hay una ruta actual para reemplazar la lista por HTTP.
   - Frontend: usa esos usuarios para mostrar avatares; NO debe tratarlos como eventos nuevos ni simular participantes.
  HERRAMIENTAS DEL JUEGO
   - Backend: guarda cronometro y contador de regalos; los regalos incrementan el contador y el boton de reset reinicia ambos. Acepta SOLO comandos incluidos en una lista permitida.
   - Frontend: recibe comandos del panel para aplicarlos al overlay activo.
  SENAL DEL OVERLAY Y WHATSAPP
   - Backend: considera el overlay activo si recibio una senal visible en los ultimos 90 s (revisa cada 15 s). Puede avisar por WhatsApp cuando pasa de activo a inactivo y por cada evento de regalo, si las alertas estan habilitadas y configuradas.
   - Frontend: reporta su visibilidad al servidor.
  PERSISTENCIA Y REGISTROS
   - Backend: los registros se reciben en lotes de hasta 200. Los textos de chat se guardan SIN autor; los eventos con nombres se retienen hasta 90 dias. [REVISAR: el texto fuente de esta fila venia cortado; completar con el codigo del servidor.]
   - Frontend: guarda en el servidor el estado del juego, el cuadro y los votos; el backend sirve una carga inicial de documentos pequenos.

11. CONTRATO CON EL BACKEND - LEER SI TOCAS EL SERVIDOR
 El frontend es UN SOLO HTML. Habla con el backend solo por estas rutas:
  GET  /api/events          Server-Sent Events (SSE) con DOS tipos de mensaje:
       event: status  data: {"connected":true|false,"status":"connecting|reconnecting|failed|..."}   (tambien acepta "isConnected")
       event: update  data: {"entry":{...}}  -> UN evento REAL del live. Campos de entry:
          type            OBLIGATORIO: 'member' | 'chat' | 'gift' | 'like' | 'follow' | 'share' (otro valor se ignora)
          username        id del usuario de TikTok (sin @). Sin username el evento no se asigna a nadie.
          content         texto del comentario (solo chat). El frontend detecta el equipo en el texto.
          activityCount   cantidad de likes o de regalos de ese evento (entero >= 1)
          giftName        nombre del regalo (tambien se leen gift_name / gift / giftId)
          giftDiamonds    diamantes totales del regalo/combo; la alerta alegre suena desde 1 diamante.
          profilePictureUrl  foto https del usuario (tambien se leen profilePicture / avatarUrl / avatar / userImage / imageUrl)
          bot             NUNCA lo envia el backend. Solo lo usa el frontend para sus eventos automaticos.
  POST /api/reconnect       inicia/reintenta la conexion con TikTok. 200 = ok, 409 = ya conectado (tambien ok). Otro error: JSON {"message":"..."}.
  GET  /api/recent-users    {"users":[{"username":"...","avatar":"https://..."}]}  SOLO personas reales (alimenta los huevos grandes mientras no hay eventos).
  GET  /manifest.webmanifest y /sw.js   para instalar como app.
 LO QUE EL BACKEND DEBE RESPETAR (reglas 1 y 11):
  - Enviar SOLO eventos reales de TikTok. PROHIBIDO inventar, duplicar o simular usuarios, comentarios, likes, regalos, seguidores o compartidos.
  - PROHIBIDO que el backend (o el JSON de usuarios) se haga pasar por personas con nombres inventados. Los bots viven solo en el frontend y se llaman tortubot_N.
  - El backend no decide puntajes ni ganadores: eso lo hace el frontend (reglas 3 y 5).
  - /api/recent-users solo debe devolver usuarios que de verdad participaron en el live.

 PARTE 5 - CONTRATO DE PERSISTENCIA (claves, logs, concurrencia, privacidad)
========================================================================================================
 ===== PERSISTENCIA EN SERVIDOR ================================================================
 DECISION DEL AUTOR: NADA se guarda en el navegador (ni localStorage ni sessionStorage ni IndexedDB). El overlay corre en un
 celular de gama media y cada JSON.stringify + escritura sincronica local le quita CPU y memoria al render. Todo lo que debe
 sobrevivir a un reinicio vive en el SERVIDOR; el cliente solo guarda en RAM lo imprescindible para dibujar.

   welcome  priority 3  saludo al hincha que ingresa (evento member). ttl 25 s, max 6. Una vez por usuario; de nuevo si reingresa pasados 10 min.
   action   priority 3  likes (se agrupan 8 s), seguir, compartir. ttl 12 s, max 3.
   match    priority 4  como va el partido, en METROS (meta = trackMeters = 100). Cada 14 s si hay silencio.
  Si el backend devuelve una tabla sin 'move' o sin 'welcome', el frontend agrega los suyos por defecto. Si el endpoint falla, usa la tabla por defecto.

  if(typeof result.signature!=='string'||!signaturePattern.test(result.signature))throw new Error('El backend devolvió una firma de despliegue no válida.');
  const url=new URL(location.href);
  if(result.signature===pageSignature){
   if(url.searchParams.get('_cluss_deploy')===pageSignature){
    const showUpdateDetected=()=>{
     if(!document.body)return;
     const notice=document.createElement('div');
     notice.textContent='Actualización detectada';
     Object.assign(notice.style,{position:'fixed',top:'12px',left:'50%',transform:'translateX(-50%)',zIndex:'99999',padding:'10px 16px',borderRadius:'10px',background:'#123c2d',color:'#eafff1',font:'700 14px system-ui',boxShadow:'0 4px 18px #0008'});
     document.body.appendChild(notice);setTimeout(()=>notice.remove(),3500);
    };
    if(document.body)showUpdateDetected();
    else document.addEventListener('DOMContentLoaded',showUpdateDetected,{once:true});
   }
   if(url.searchParams.has('_cluss_deploy')){url.searchParams.delete('_cluss_deploy');history.replaceState(null,'',url)}
   return true
  }
  if(url.searchParams.get('_cluss_deploy')===result.signature){console.error('El overlay sigue desactualizado después de intentar actualizarlo.');return false}
  url.searchParams.set('_cluss_deploy',result.signature);
  try{await clearClussOverlayCache()}catch(error){console.warn('No se pudo borrar el caché del overlay antes de actualizar.',error)}
  location.replace(url.href)
  return false
 }catch(error){console.warn('No se pudo comprobar la versión del overlay.',error);return true}
 })().finally(()=>{deploymentCheckPromise=null});
 return deploymentCheckPromise;
};

#stp .stb{flex:1;min-height:0;overflow:auto} /* min-height:0 deja que el contenido haga scroll en vez de empujar fuera lo demas */
#stp table{width:100%;border-collapse:collapse}#stp td,#stp th{padding:4px 3px;border-bottom:1px solid #3f2713;text-align:left;vertical-align:top}
#stp pre{white-space:pre-wrap;font:10px/1.4 ui-monospace,monospace;max-height:180px;overflow:auto;margin:4px 0}

/* barra de herramientas: usuario + botones siempre visibles en una sola fila */

.top3{justify-items:center}
.top3 .tp:first-child{grid-column:1/-1}
.top3 .tp:first-child svg{width:76px;height:53px}
.top3 .tp:first-child b{font-size:15px}
.top3 .tp:first-child .cr{font-size:20px;top:-14px;right:8px}
/* alerta = el propio avatar del usuario: aparece grande sobre los huevos, con el icono del evento en la esquina, y despues baja al nido */
.ev{display:flex;gap:2px;z-index:6;bottom:calc(1% + 112px)}
.ev[hidden]{display:none}
.ev .ua.hero{position:relative;display:grid;place-items:center;font-size:26px;line-height:58px;box-shadow:0 0 0 2px #fff,0 3px 7px rgba(0,0,0,.6);animation:none;overflow:hidden;background:linear-gradient(180deg,#fff,#d9d9d9);color:#1c140e}
.ev .ua.hero img{width:100%;height:100%;object-fit:cover;display:block}
.ev .ua.hero.bt{font-size:26px}
.fan-alerts{position:absolute;inset:0;z-index:11;pointer-events:none;overflow:visible}
.fan-alert{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;max-width:96%;padding:2px 5px;border:1px solid var(--c,#3f2713);border-radius:10px;background:rgba(255,255,255,.95);color:#2a2018;box-shadow:0 2px 5px rgba(0,0,0,.5);white-space:nowrap;animation:fanAlertIn .2s ease-out}
.fan-alert .ua.hero{position:relative;display:grid;place-items:center;flex:none;width:32px;height:36px;border:2px solid var(--c,#3f2713);border-radius:50%;overflow:hidden;background:#eee;font-size:16px;line-height:1}
.fan-alert .ua.hero img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .15s ease-out}
.fan-alert .eb{font-size:13px}
.fan-alert .en{max-width:54px;overflow:hidden;text-overflow:ellipsis;font:800 7px/1.1 Inter,sans-serif}
@keyframes fanAlertIn{from{opacity:0;scale:.65}to{opacity:1;scale:1}}
@media (prefers-reduced-motion:reduce){.fan-alert{animation:none}}
@keyframes land{to{transform:translate(-50%,80px) scale(.3);opacity:0}}
.ua.top{box-shadow:0 0 0 2px #ffd566,0 0 7px 1px #ffd566}
.foot .live{flex:0 1 auto}
#stp header span{display:flex;gap:6px}
/* TURBO: rojo, grande y parpadeando cuando el contador llega al limite */
@keyframes tbk{0%,100%{transform:scale(1);opacity:1;box-shadow:0 0 6px 1px #ff2d2d}50%{transform:scale(1.18);opacity:.5;box-shadow:0 0 16px 5px #ff2d2d}}

.lane.turbo .hd:after{content:"🔥 TURBO";left:50%;top:-13px;transform:translateX(-50%);background:#e11d48;color:#fff;border:2px solid #fff;border-radius:9px;padding:1px 7px;font:800 12px/1.2 Inter,sans-serif;white-space:nowrap;text-shadow:0 1px 1px #000;box-shadow:0 0 10px 2px #ff2d2d;animation:tbk .5s ease-in-out infinite;z-index:6}

/* botones de accion mas altos */
.side{position:relative}


 /* botones de accion pegados bajo el avatar: asi el fixture gana alto */

.ua.blank{background:#f6f1e6!important;border-color:#e3d9c4!important;box-shadow:inset 0 -3px 4px rgba(0,0,0,.12)}

/* contador de me gusta: medidor limpio con el numero DENTRO de la barra */
.hb{position:relative;gap:0;padding:0;background:none;border-radius:0}
.hb i{position:relative;flex:1;height:18px;border:2px solid rgba(255,255,255,.85);border-radius:9px;background:rgba(20,10,4,.55);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.hb i b{position:absolute;left:0;top:0;z-index:1}
.hb{cursor:default}
.hb em{position:absolute;top:0;bottom:0;display:flex;align-items:center;min-width:0;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none;z-index:1}
/* alerta: avatar del usuario con la burbuja del evento arriba, estilo compacto */
.ev{flex-direction:row;padding:2px 8px;align-items:flex-end}
.ev .eb{position:absolute;top:-8px;right:-6px;font-size:18px;line-height:1.2;background:#fff;border:2px solid var(--c,#3f2713);border-radius:12px;padding:0 4px;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.ev .ua.hero{width:42px;height:50px;border-width:2px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%}
/* v2.1 CONTADOR DE TAPS: que cada tap se SIENTA. Marcas cada 10, +N flotante por tap, premio +1 visible y barra que brilla */
.hb i b{transition:width .1s ease-out}
.hb i:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(0,0,0,.5) calc(10% - 1px),rgba(0,0,0,.5) 10%)}
.hb.bump i b{filter:brightness(1.35)}
.hb em{justify-content:flex-start;right:2px;font-size:11px;font-weight:800}
.hb .tp{position:absolute;left:30%;top:-2px;z-index:4;font-weight:800;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #ff2d55;pointer-events:none;animation:tpu .75s ease-out forwards}

.hb.full i{animation:hbf .6s ease-out}
@keyframes hbf{0%,60%{box-shadow:0 0 14px 5px #ffd566}100%{box-shadow:0 1px 3px rgba(0,0,0,.5)}}

<!-- ===== PERSISTENCIA EN SERVIDOR: NADA se guarda en el navegador (ni localStorage, sessionStorage ni IndexedDB); todo vive en el SERVIDOR. Contrato de rutas, claves y logs: PARTE 5 del bloque del backend (al inicio del archivo) o del BACKEND_README del repo. ===== -->
<script src="/api/state.js"></script>
<script>
/* SRV: unica puerta de persistencia del cliente. Ver el contrato en la PARTE 5 del bloque del backend (inicio del archivo) o del BACKEND_README del repo. API: get(k,def) · set(k,valor,{keep}) · del(k) · load(k)->Promise · log(flujo,registro) · clearLog(flujo) · flush(urgente) */
(function(){
'use strict';
var BOOT=(window.CLUSS_STATE&&typeof window.CLUSS_STATE==='object')?window.CLUSS_STATE:{};
var mem=Object.assign({},BOOT),DOC='/api/state/',LOG='/api/log/';
var HEAVY=/^cluss\.(stats|libreVotes|vs|fans|log\.)/;       /* claves pesadas: se envian cada 5 s, no cada 1 s */
var docs=new Map(),logs={};
var wait=function(s,k){return s.fails?Math.min(60000,2000*Math.pow(2,s.fails)):(HEAVY.test(k)?5000:1000)};
function send(k,urgent){
 var s=docs.get(k);if(!s||!s.dirty||s.busy)return;
 s.dirty=false;s.busy=true;
 var put=s.op==='put',body;
 if(put){try{body=JSON.stringify(mem[k])}catch(e){s.busy=false;return}}
 fetch(DOC+encodeURIComponent(k),{method:put?'PUT':'DELETE',headers:put?{'Content-Type':'application/json'}:undefined,body:body,keepalive:!!(urgent&&body&&body.length<60000)})
 .then(function(r){if(!r.ok)throw 0;s.fails=0;if(put&&!s.dirty&&s.keep===false)delete mem[k]}) /* keep:false = ya esta en el servidor, se libera la RAM */
 .catch(function(){s.dirty=true;s.fails++})
 .then(function(){s.busy=false;if(s.dirty&&!s.t)s.t=setTimeout(function(){s.t=0;send(k)},wait(s,k))});
}
function sched(k,op,opt){
 var s=docs.get(k);if(!s){s={t:0,busy:false,dirty:false,fails:0,op:'put',keep:true};docs.set(k,s)}
 s.op=op;s.dirty=true;s.keep=!(opt&&opt.keep===false);
 if(!s.t&&!s.busy)s.t=setTimeout(function(){s.t=0;send(k)},wait(s,k));
}
function sendLog(f,urgent){
 var s=logs[f];if(!s||s.busy||!s.q.length)return;
 var batch=s.q.splice(0,200),body=JSON.stringify({records:batch});s.busy=true;
 fetch(LOG+f,{method:'POST',headers:{'Content-Type':'application/json'},body:body,keepalive:!!(urgent&&body.length<60000)})
 .then(function(r){if(!r.ok)throw 0;s.fails=0})
 .catch(function(){s.q=batch.concat(s.q);s.fails++;if(s.q.length>2000)s.q.splice(0,s.q.length-2000)}) /* tope de RAM si el servidor no responde */
 .then(function(){s.busy=false;if(s.q.length&&!s.t)s.t=setTimeout(function(){s.t=0;sendLog(f)},s.fails?Math.min(60000,2000*Math.pow(2,s.fails)):(s.q.length>=200?500:5000))});
}
function flush(urgent){docs.forEach(function(s,k){if(s.t){clearTimeout(s.t);s.t=0}send(k,urgent)});Object.keys(logs).forEach(function(f){var s=logs[f];if(s.t){clearTimeout(s.t);s.t=0}sendLog(f,urgent)})}
window.SRV={
 get:function(k,d){var v=mem[k];return v==null?d:v},
 set:function(k,v,opt){mem[k]=v;sched(k,'put',opt);return true},
 del:function(k){delete mem[k];sched(k,'del');},
 load:function(k){if(mem[k]!=null)return Promise.resolve(mem[k]);return fetch(DOC+encodeURIComponent(k)).then(function(r){return r.ok?r.json():null}).catch(function(){return null})},
 log:function(f,rec){var s=logs[f]||(logs[f]={q:[],t:0,busy:false,fails:0});s.q.push(rec);if(s.q.length>2000)s.q.splice(0,s.q.length-2000);if(!s.t&&!s.busy)s.t=setTimeout(function(){s.t=0;sendLog(f)},5000)},
 clearLog:function(f){var s=logs[f];if(s)s.q.length=0;fetch(LOG+f,{method:'DELETE'}).catch(function(){})},
 flush:flush
};
addEventListener('pagehide',function(){flush(true)});
document.addEventListener('visibilitychange',function(){if(document.hidden)flush(true)});
})();
</script>
<script>
/* si /activity-policy.js no carga o le faltan funciones, se rellenan aqui */
(function(){var P=window.TORTUWORLD_ACTIVITY_POLICY=window.TORTUWORLD_ACTIVITY_POLICY||{};
 if(Object.isFrozen(P))P=window.TORTUWORLD_ACTIVITY_POLICY=Object.assign({},P);
 if(typeof P.resolveSupportSide!=='function'){
  P=window.TORTUWORLD_ACTIVITY_POLICY=Object.assign({},P,{resolveSupportSide:function(username,teamCount,assignedSide,configuredSide){
   if(!Number.isInteger(teamCount)||teamCount<1)return-1;
   var valid=function(side){return Number.isInteger(side)&&side>=0&&side<teamCount};
   if(valid(assignedSide))return assignedSide;
   if(valid(configuredSide))return configuredSide;
   var name=String(username||'').trim().toLowerCase();if(!name)return 0;
   var hash=0;for(var i=0;i<name.length;i++)hash+=name.charCodeAt(i);
   return hash%teamCount;
  }});
 }
 P.HEART_START=45;P.HEART_STEP=0;P.HEART_MAX=45;
 P.isInteractionEvent=P.isInteractionEvent||function(t){return['chat','like','gift','follow','share'].indexOf(t)>=0};
 P.tapEventDelta=P.tapEventDelta||function(t,n){var w={member:1,chat:10,like:1,follow:3,share:5}[t]||0,c=+n;return w?w*(isFinite(c)&&c>0?Math.max(1,Math.floor(c)):1):0};
 P.statEventDelta=P.statEventDelta||function(t,n){var w={member:1,chat:5,like:1,follow:3,share:3,gift:10}[t]||0,c=+n;return w?w*((t==='gift'||t==='like')&&isFinite(c)&&c>0?Math.max(1,Math.floor(c)):1):0};
 P.eventCountDelta=P.eventCountDelta||function(t,n){if(['member','chat','gift','like','follow','share'].indexOf(t)<0)return 0;var c=+n;return t==='gift'||t==='like'?(isFinite(c)&&c>0?Math.max(1,Math.floor(c)):1):1};
 P.consumeTapCount=P.consumeTapCount||function(c,a,l){l=Math.floor(+l);if(!isFinite(l)||l<1)return{remaining:0,activations:0};var total=Math.max(0,Math.floor(+c||0))+Math.max(0,Math.floor(+a||0));return{remaining:total%l,activations:Math.floor(total/l)}};
 P.consumeTapCountWithNextLimit=P.consumeTapCountWithNextLimit||function(c,a,l){l=Math.floor(+l);if(!Number.isSafeInteger(l)||l<1)return{remaining:0,activations:0,nextLimit:l};var total=Math.min(Number.MAX_SAFE_INTEGER,Math.max(0,Math.floor(+c||0))+Math.max(0,Math.floor(+a||0)));if(total<l)return{remaining:total,activations:0,nextLimit:l};var r=total-l,n=Math.min(P.HEART_MAX,l+10);if(n<=l)return{remaining:r%l,activations:1+Math.floor(r/l),nextLimit:l};var lo=0,hi=Math.ceil(Math.sqrt(r/5))+1;while(lo<hi){var mid=Math.ceil((lo+hi)/2),cost=mid*(n+(mid-1)*5);if(cost<=r)lo=mid;else hi=mid-1}var used=lo*(n+(lo-1)*5);return{remaining:r-used,activations:1+lo,nextLimit:Math.max(l,Math.min(P.HEART_MAX,n+lo*10))}};
 P.nextTapLimit=P.nextTapLimit||function(current){var limit=Math.floor(Number(current));if(!Number.isSafeInteger(limit)||limit<1)return P.HEART_START;return Math.max(limit,Math.min(P.HEART_MAX,limit+10))};
 P.giftProgress=P.giftProgress||function(n,p){return Math.max(0,+n||0)*Math.max(0,+p||0)};
 P.giftTurboDuration=P.giftTurboDuration||function(n,d){return Math.max(0,Math.floor(+n||0))*Math.max(0,+d||0)};
 P.tapLimitStep=P.tapLimitStep||function(){return 0};
 P.inactivityTimeoutMs=P.inactivityTimeoutMs||function(){return 60000};
 P.inactivityRemainingSeconds=P.inactivityRemainingSeconds||function(i,t){return Math.max(0,Math.ceil((t-i)/1000))};
 P.shouldFinishForInactivity=P.shouldFinishForInactivity||function(i,t){return i>=t};
 P.createIdleVisualAdvance=P.createIdleVisualAdvance||function(){var meters=0,lastAt=null;return{
  reset:function(now){meters=0;lastAt=Number(now);if(!Number.isFinite(lastAt))lastAt=Date.now();return meters},
  update:function(now,lastInteractionAt,enabled){var current=Number(now);if(!Number.isFinite(current))return meters;var interaction=Number(lastInteractionAt),start=lastAt===null?current:Math.max(lastAt,Number.isFinite(interaction)?interaction:current);if(enabled&&lastAt!==null)meters+=Math.max(0,current-start)/1000;lastAt=current;return meters}
 }};})();
</script>

/* ===== TORNEO LIBRE =====
   Un duelo suelto (2 carriles) por carrera. Los equipos los propone el chat REAL: cada comentario que nombre un equipo (de CUALQUIER torneo)

<!-- ===== caparazon con los colores de la camiseta + nombre grande ENCIMA de la tortuga ===== -->
<script>
(function(){
const NS='http://www.w3.org/2000/svg';
function ajusta(i){const t=$('#clubName'+i);if(!t)return;const n=(T[i]&&T[i].n)||t.textContent||'';
 t.setAttribute('x',50);t.setAttribute('y',436);t.setAttribute('font-weight',900);t.setAttribute('fill','#fff');t.setAttribute('stroke','#000');t.setAttribute('stroke-width',1.4);
 t.setAttribute('font-size',Math.max(10,Math.min(17,98/(n.length*.62))).toFixed(1));
 let r=t.parentNode.querySelector('.cnBg');if(!r){r=document.createElementNS(NS,'rect');r.setAttribute('class','cnBg');t.parentNode.insertBefore(r,t)}
 try{const q=t.getBBox();if(q.width){r.setAttribute('x',q.x-5);r.setAttribute('y',q.y-2);r.setAttribute('width',q.width+10);r.setAttribute('height',q.height+4);r.setAttribute('rx',6);r.setAttribute('fill','rgba(10,6,2,.78)');r.setAttribute('stroke','#ffe14d');r.setAttribute('stroke-width',1.5)}}catch(e){}}
function camiseta(i){const sh=document.querySelector('#in'+i+' .sh');if(!sh||!T[i])return;let g=sh.querySelector('.shE');
 if(!g){const svg=sh.ownerSVGElement;let defs=svg.querySelector('defs');if(!defs){defs=document.createElementNS(NS,'defs');svg.insertBefore(defs,svg.firstChild)}
  const cp=document.createElementNS(NS,'clipPath');cp.id='shE'+i;cp.innerHTML='<ellipse cx="50" cy="489" rx="20.5" ry="24.5"/>';defs.appendChild(cp);
  g=document.createElementNS(NS,'g');g.setAttribute('class','shE');g.setAttribute('clip-path','url(#shE'+i+')');
  sh.insertBefore(g,sh.querySelector('ellipse[fill^="url(#s"]'))}
 g.innerHTML=flag(T[i].id,29.5,464.5,41,49);
 if(!/^ct-/.test(T[i].id))g.querySelectorAll('image').forEach(x=>x.remove())} /* clubes: caparazon = camiseta lisa, sin escudo repetido */
function todo(){T.forEach((_,i)=>{try{ajusta(i);camiseta(i)}catch(e){}})}
const _ad=aplicarDuelo;aplicarDuelo=function(){const r=_ad.apply(this,arguments);todo();return r};

const _u=update;update=function(){const r=_u.apply(this,arguments);todo();return r};

<!-- ===== boton 🚩 BANDERAS en la fila de herramientas: catalogo en 3 columnas (Libertadores, Champions, Copa del Mundo), generado desde los POOL ===== -->
<style id="banderas-css">
#panBand{position:fixed;inset:0;z-index:210;overflow:auto;background:#1b120a;color:#fff;font-family:Inter,system-ui,sans-serif;padding:10px 10px 18px}
#panBand .top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-10px -10px 8px;padding:10px;background:#1b120a;border-bottom:2px solid #6f4a28}

#panBand .x{padding:6px 12px;border-radius:8px;border:2px solid #ffe14d;background:#3a2412;color:#ffe14d;font:800 12px Inter,sans-serif;cursor:pointer}
#panBand .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:start}

#panBand .col h3 small{display:block;color:#c9b48f;font-weight:700;font-size:9px}
#panBand .it{display:flex;align-items:center;gap:5px;padding:3px;margin-bottom:3px;border-radius:6px;border:1px solid transparent;font:700 9px/1.1 Inter,sans-serif}
#panBand .it.on{border-color:#ffe14d;background:rgba(255,225,77,.12)}
#panBand .it svg{flex:none;width:30px;height:20px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
#panBand .it span{min-width:0;overflow-wrap:anywhere}</style>
<script>
(function(){
/* orden de cada columna: Libertadores y Champions como estan; Copa del Mundo con los campeones primero */
function cols(){
 /* COUNTRY_POOL se amplia luego con el catalogo de ~214 banderas; aqui solo las selecciones del torneo */
 const SEL='ar br de es fr it uy en hr dk ec gh ir jp mx ma nl pl pt qa sa sn rs kr ch tn us be ca cm cr au wl py cl co pe ve bo pa hn sv gt cu do jm ht ni cn in ru tr ua se no at gr eg ng za ci sc ie hu cz ro id th'.split(' ').map(c=>'ct-'+c);
 const mundial=SEL.filter(id=>COUNTRY_POOL[id]);
 return [
  [{t:'🏆 LIBERTADORES',ids:Object.keys(LIBERTADORES_POOL)},{t:'💎 ELITE NATIONS CUP',ids:Object.keys(ELITE_POOL)}],
  [{t:'⭐ CHAMPIONS',ids:Object.keys(CHAMPIONS_POOL)},{t:'⚔️ CLÁSICOS',ids:Object.keys(CLASSICS_POOL)}],
  [{t:'🌎 COPA DEL MUNDO',ids:mundial}]
 ];
}
function abre(){
 if(document.getElementById('panBand'))return;
 const jugando=new Set(T.map(x=>x.id));
 const d=document.createElement('div');d.id='panBand';d.setAttribute('role','dialog');d.setAttribute('aria-label','Banderas de los torneos');
 d.innerHTML='<div class="top"><h2>🚩 BANDERAS</h2><button type="button" class="x">CERRAR</button></div><div class="cols">'+
  cols().map(g=>'<div class="stk">'+g.map(c=>'<div class="col"><h3>'+c.t+'<small>'+c.ids.length+' participantes</small></h3>'+
   c.ids.map(id=>{const it=tournamentItem(id);if(!it)return'';
    return '<div class="it'+(jugando.has(id)?' on':'')+'"><svg viewBox="0 0 40 26" aria-hidden="true">'+flag(id,0,0,40,26)+'</svg><span>'+it.n+'</span></div>'}).join('')+'</div>').join('')+'</div>').join('')+'</div>';
 document.body.appendChild(d);
 const cierra=()=>{d.remove();removeEventListener('keydown',esc)};
 const esc=e=>{if(e.key==='Escape')cierra()};
 addEventListener('keydown',esc);
 d.querySelector('.x').onclick=cierra;
}
})();
</script>

<script>
(function(){
const box=document.createElement('div');box.id='shout';box.setAttribute('aria-live','polite');(document.getElementById('app')||document.body).appendChild(box);
const nm=i=>{try{const n=T[i].n;return n[0].toUpperCase()+n.slice(1).toLowerCase()}catch(e){return'tu equipo'}};
const mostrar=h=>{while(box.children.length>=2)box.firstChild.remove();const d=document.createElement('div');d.className='it';d.innerHTML=h;box.appendChild(d);setTimeout(()=>d.remove(),4100)};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const visto=new Map(),pts=new Map(),COOL=45000; /* un reconocimiento por persona cada 45 s */
registerRoundCleanup(()=>{visto.clear();pts.clear();box.replaceChildren()});
const pocos=(u)=>{const t=performance.now();if(visto.has(u)&&t-visto.get(u)<COOL)return false;visto.set(u,t);return true};
const FR={
 chat:(u,c)=>`🔥 <b>@${u}</b> es hincha de <b>${c}</b>`,
 follow:(u,c)=>`🤝 ¡Bienvenido a la familia, <b>@${u}</b>!`,
 share:(u,c)=>`📣 ¡Gracias <b>@${u}</b> por traer más hinchas!`};
const _h=handleLiveEntry;
handleLiveEntry=function(e){const r=_h.apply(this,arguments);
 try{if(e&&!e.bot&&e.type!=='gift'&&e.username&&FR[e.type]){
   const u=esc(e.username),big=e.type==='gift'||e.type==='share'||e.type==='follow';
   if(big||pocos(e.username)){let t=-1;try{t=recentChatTeam(String(e.username).toLowerCase())}catch(x){}
     mostrar(FR[e.type](u,t>=0?nm(t):'su club'));
     pts.set(e.username,(pts.get(e.username)||0)+({gift:10,share:3,follow:3,chat:1}[e.type]||1));if(big){try{say('¡Gracias '+e.username+'!')}catch(x){}}}}}catch(x){}
 return r};
/* Hincha destacado: cada ~60 s Don Tortu nombra al usuario real con mas puntos de la ronda (sin pedir nada) */
setInterval(()=>{try{if(over||document.hidden)return;let best=null;pts.forEach((v,k)=>{if(!/^tortubot/i.test(k)&&(!best||v>best[1]))best=[k,v]});
 if(!best)return;
 let ti=-1;try{const k=String(best[0]).toLowerCase();ti=picks.has(k)?picks.get(k):recentChatTeam(k)}catch(x){}
 const eq=ti>=0&&T[ti]?nm(ti):''; /* su equipo o pais (T[ti].n: club o seleccion segun el torneo) */
 const t='¡Hincha destacado: '+best[0]+'!'+(eq?' Hinchada de '+eq+'.':'')+' Gracias por alentar.';
 mostrar('⭐ <b>Hincha destacado</b> · @'+esc(best[0])+(eq?' · '+esc(eq):''));say(t)}catch(x){}},60000);
})();

<script>
(function(){
'use strict';
const side=document.querySelector('.side');
if(!side)return;
const box=document.createElement('section');
box.id='honor';box.setAttribute('aria-label','Cuadro de honor');
box.innerHTML='<div class="hh">🏅 HONOR</div><div class="hn-view" id="hnView" aria-live="polite"></div>';
side.insertBefore(box,side.querySelector('.bub')||side.firstChild);
const view=box.querySelector('#hnView'),count=document.querySelector('#giftCount'),counter=document.querySelector('#giftCounter');
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const key=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
const https=value=>/^https:\/\//i.test(String(value||''));
const rose={key:'rose',name:'Rosa',value:1,enabled:true,aliases:['rose','rosa','rosita'],emoji:'🌹',imageUrl:''};
const RATE_EVENT_TYPES=new Set(['member','chat','gift','like','follow','share']);
let catalog=[rose],race={id:'',last:null,users:new Map()},seen=new Set(),total=0,turboUntil=0,giftTurboMs=0,rotationSeconds=0,rotationTimer=0,idleKey='rose',showGiftDetails=true,eventsThisMinute=0;
const eventRate=document.querySelector('#eventRate');
const tiers=[{min:10,label:'👑 LEYENDA'},{min:3,label:'🔥 FANÁTICO'},{min:1,label:'🎖️ HONOR'}];
function findGift(entry){
 const name=key(entry.giftName||entry.gift_name||entry.gift),id=entry.giftId?'id-'+key(entry.giftId):'';
 return catalog.find(gift=>gift.key===name||gift.aliases.includes(name)||(id&&gift.key===id))||null;
}
function icon(gift,url,emoji){
 const image=https(url)?url:'',fallback=esc(emoji||(gift&&gift.emoji)||'🎁');
 return image?`<span class="hn-gicon"><img alt="" referrerpolicy="no-referrer" src="${esc(image)}" data-fallback="${fallback}" onerror="this.parentNode.textContent=this.dataset.fallback"></span>`:`<span class="hn-gicon" aria-hidden="true">${fallback}</span>`;
}
function avatar(url){
 return https(url)?`<span class="hn-avatar"><img alt="" referrerpolicy="no-referrer" src="${esc(url)}" onerror="this.parentNode.textContent='👤'"></span>`:'<span class="hn-avatar" aria-hidden="true">👤</span>';
}
function paintIdle(gift){
 if(!showGiftDetails){view.innerHTML='<span class="hn-flower" role="img" aria-label="Rosa">🌹</span>';return}
 const roseGift=gift||catalog.find(item=>item.key==='rose')||rose;
 view.innerHTML=`<div class="hn-aura">${icon(roseGift,roseGift.imageUrl,roseGift.emoji)}</div>`;
}
function rotateIdle(){
 const enabled=catalog.filter(gift=>gift.enabled);
 if(!showGiftDetails||race.last||enabled.length<2)return;
 const index=enabled.findIndex(gift=>gift.key===idleKey),next=enabled[(index+1)%enabled.length];
 idleKey=next.key;paintIdle(next);
}
function scheduleRotation(){
 clearInterval(rotationTimer);rotationTimer=0;
 if(showGiftDetails&&rotationSeconds>0&&catalog.filter(gift=>gift.enabled).length>1)
  rotationTimer=setInterval(rotateIdle,rotationSeconds*1000);
}
function paintHit(){
 const item=race.last;
 if(!item){paintIdle();return}
 const tier=tiers.find(value=>item.total>=value.min);
 const left=Math.max(0,Math.ceil((turboUntil-Date.now())/1000));
 const giftDetails=showGiftDetails?`<div class="hn-row">${icon(item.gift,item.giftImage,item.emoji)}<b class="hn-qty">×${item.n}</b><span class="hn-name">${esc(item.giftName)}</span></div>`:'';
 view.innerHTML=`<div class="hn-hit"><div class="hn-user">${avatar(item.avatar)}<span class="hn-user-meta"><b class="hn-un">@${esc(item.user)}</b><span class="hn-tier">${tier?tier.label:''}</span></span></div>${giftDetails}<div class="hn-meta"><span>carrera ×${item.total}</span><span class="hn-turbo" ${left?'':'hidden'}>⚡ ${left}s</span></div></div>`;
}
setInterval(()=>{if(!race.last)return;const turbo=view.querySelector('.hn-turbo');if(!turbo)return;
 const left=Math.max(0,Math.ceil((turboUntil-Date.now())/1000));turbo.hidden=!left;turbo.textContent=`⚡ ${left}s`;
},500);
function updateCounter(){
 if(!count||!counter)return;
 count.textContent=String(total);counter.setAttribute('aria-label',`Regalos mostrados en esta sesión: ${total}`);
 counter.title=`Regalos mostrados en esta sesión: ${total}`;
}
const HB=window.HonorBoard={
 persist:false,
 startRace(id){
  race={id:String(id||Date.now()),last:null,users:new Map()};seen.clear();turboUntil=0;idleKey='rose';
  paintIdle();scheduleRotation();window.dispatchEvent(new CustomEvent('honor:race-start',{detail:{raceId:race.id}}));
 },
 onGift(entry){
  if(!entry||entry.type!=='gift'||entry.bot)return false;
  const user=String(entry.username||'').trim();if(!user)return false;
  if(entry.eventId){const id=String(entry.eventId);if(seen.has(id))return false;seen.add(id);if(seen.size>200)seen.delete(seen.values().next().value)}
  const gift=findGift(entry);if(entry.enabled===false||(gift&&gift.enabled===false))return false;
  clearInterval(rotationTimer);rotationTimer=0;
  const n=Math.max(1,Math.floor(Number(entry.activityCount)||1)),userKey=user.toLowerCase();
  const record=race.users.get(userKey)||{total:0};record.total+=n;race.users.set(userKey,record);
  const name=String(entry.giftName||entry.gift_name||entry.gift||(gift&&gift.name)||'Regalo').slice(0,40);
  race.last={user,avatar:entry.profilePictureUrl||entry.profilePicture||entry.avatarUrl||entry.avatar||entry.userImage||entry.imageUrl||'',gift,giftName:gift?gift.name:name,giftImage:https(entry.giftImageUrl)?entry.giftImageUrl:(gift&&gift.imageUrl)||'',emoji:gift&&gift.emoji||'🎁',n,total:record.total};
  turboUntil=Math.max(Date.now(),turboUntil)+n*giftTurboMs;total++;updateCounter();paintHit();return true;
 },
 setCatalog(value){
  const source=Array.isArray(value&&value.catalog)?value.catalog:Array.isArray(value)?value:[];
  const normalized=source.filter(item=>item&&typeof item.key==='string').map(item=>{
   const iconValue=item.icon||item.emoji||'',rawName=String(item.name||item.key),emoji=item.emoji||item.icon||'🎁';
   return{...item,key:key(item.key),name:iconValue&&rawName.startsWith(iconValue)?rawName.slice(iconValue.length).trim():rawName,
    enabled:item.enabled!==false,aliases:Array.isArray(item.aliases)?item.aliases.map(key):[],emoji,
    imageUrl:https(item.imageUrl||item.avatarUrl)?(item.imageUrl||item.avatarUrl):''};
  }).filter(item=>item.key);
  if(!normalized.some(item=>item.key==='rose'))normalized.unshift(rose);
  catalog=normalized;
  const seconds=Number(value&&value.rotationSeconds);
  rotationSeconds=Number.isFinite(seconds)&&seconds>=0?Math.min(3600,seconds):0;
  if(!race.last){idleKey='rose';paintIdle();scheduleRotation()}
 },
 setTurbo(value){if(value&&Number(value.giftTurboMs)>0)giftTurboMs=Number(value.giftTurboMs)},
 setGiftDisplay(enabled){
  showGiftDetails=enabled!==false;
  if(!race.last){idleKey='rose';paintIdle();scheduleRotation()}
  else paintHit();
 },
 setEventsPerMinute(value){
  eventsThisMinute=Math.max(0,Math.floor(Number(value)||0));
  if(eventRate){eventRate.textContent=String(eventsThisMinute);eventRate.setAttribute('aria-label',`${eventsThisMinute} eventos recibidos en el último minuto`)}
 },
 handleSse(type,data){
  try{const value=JSON.parse(data);
   if(type==='update'&&value.entry)return HB.onGift(value.entry);
   if(type==='gift-config')HB.setCatalog(value);
   if(type==='game-settings')HB.setTurbo(value);
  }catch(error){console.error('No se pudo procesar un evento de Honor.',error)}
  return false;
 },
 connect(){
  const events=new EventSource('/api/events'),tools=new EventSource('/api/game-tools/events');
  events.addEventListener('update',event=>HB.handleSse('update',event.data));
  ['gift-config','game-settings'].forEach(type=>tools.addEventListener(type,event=>HB.handleSse(type,event.data)));
  return{events,tools};
 }
};
counter.addEventListener('click',()=>HB.onGift({type:'gift',username:'prueba',giftName:'Rose',giftId:'rose',activityCount:1,eventId:`emulated-${Date.now()}`,emulated:true}));
const previousEntry=handleLiveEntry;
handleLiveEntry=function(entry){const result=previousEntry.apply(this,arguments);
 if(entry&&!entry.bot&&!entry.emulated&&RATE_EVENT_TYPES.has(entry.type))HB.setEventsPerMinute(eventsThisMinute+1);
 if(entry&&!entry.bot&&entry.type==='gift')HB.onGift(entry);return result};
setInterval(()=>HB.setEventsPerMinute(0),60000);
const previousReset=reset;
reset=function(){const result=previousReset.apply(this,arguments);HB.startRace(Date.now());return result};
window.addEventListener('gift-config-update',event=>HB.setCatalog(event.detail));
HB.setCatalog(safe(()=>SRV.get('cluss.gifts',null))||{catalog:[rose]});
HB.startRace();
fetch('/api/gifts/catalog',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()})
 .then(HB.setCatalog).catch(error=>console.error('No se pudo cargar el catálogo de regalos de Honor.',error));
})();
</script>

const savePref=()=>{try{SRV.set(LSL,pref)}catch(e){}}; /* BACKEND: PUT /api/state/cluss.lang */
const DEF=m=>(pref[m]||'en')==='en';
let last=null;

 +'<p>Ir ▶ = pasar a ese torneo / go to that tournament</p></div>'}
const abrir=()=>{draw();pan.hidden=false},cerrar=()=>{pan.hidden=true};

<!-- ===== ARCHIVOS: VOTOS DEL TORNEO LIBRE + TEXTOS DEL CHAT, votos como documento en el SERVIDOR (cluss.libreVotes) y textos del chat como flujo append-only (chat-texts) =====
 · cluss.libreVotes  = votos por equipo, de la ronda actual, historial de rondas y usuarios UNICOS. Los usuarios se guardan solo como huella con sal (no reversible a nombre); el JSON que se descarga ni siquiera incluye las huellas, solo los conteos.
 · cluss.chatArchive = TODOS los textos reales del chat (sin bots), SIN autor. Solo [fecha, texto].
 · Boton 🗂️ de la barra: panel con conteos (sin mostrar textos ni nombres), descarga de votos (JSON), chat (JSON o TXT) y, aparte, "Vaciar archivo del chat" con confirmacion. Descargar NUNCA borra.
 La retencion de textos y logs la decide el servidor (ya no hay limite de espacio del navegador); solo se recortan las rondas de votos mas viejas (tope MAX_ROUNDS). ===== -->
<style id="archivo-css">
#arch{position:absolute;inset:0;z-index:40;background:#1b120a;color:#f3ece1;padding:10px;display:flex;flex-direction:column;gap:8px;font:12px/1.4 Inter,sans-serif;overflow:auto}

<script>
(function(){
'use strict';
const K_V='cluss.libreVotes',K_C='cluss.chatArchive',MAX_ROUNDS=500,MAX_TXT=500;
const ld=k=>SRV.get(k,null);   /* BACKEND: cluss.libreVotes viene en /api/state.js */
const sv=(k,v)=>SRV.set(k,v);  /* BACKEND: PUT /api/state/cluss.libreVotes (pesado, 1 PUT / 5 s) */
const iso=t=>new Date(t).toISOString(),stamp=()=>iso(Date.now()).replace(/[:.]/g,'-').toLowerCase();
const persist=(key,obj,trim)=>{for(let i=0;i<40;i++){if(sv(key,obj))return true;if(!trim())break}return false};

/* ---------- VOTOS DEL TORNEO LIBRE ---------- */
let VS=ld(K_V);
if(!VS||typeof VS!=='object'||VS.v!==1)VS={v:1,salt:Math.random().toString(36).slice(2)+Date.now().toString(36),created:Date.now(),updated:Date.now(),total:{},round:{},all:[],rounds:[]};
['total','round'].forEach(k=>{if(!VS[k]||typeof VS[k]!=='object')VS[k]={}});if(!Array.isArray(VS.all))VS.all=[];if(!Array.isArray(VS.rounds))VS.rounds=[];
/* huella con sal de 53 bits (cyrb53): cuenta personas distintas sin guardar el nombre */
const H=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const uid=u=>H(VS.salt+'|'+String(u).trim().toLowerCase());
let vT=0;
const saveV=now=>{if(now){clearTimeout(vT);vT=0;persist(K_V,VS,()=>VS.rounds.length?(VS.rounds.splice(0,Math.ceil(VS.rounds.length*.2)),true):false);return}
 if(!vT)vT=setTimeout(()=>{vT=0;saveV(true)},500)};
function vote(user,ids){
 if(!user||!ids||!ids.length)return;
 const h=uid(user);
 ids.forEach(id=>{[VS.total,VS.round].forEach(m=>{const r=m[id]||(m[id]={votes:0,u:[]});r.votes++;if(!r.u.includes(h))r.u.push(h)})});
 if(!VS.all.includes(h))VS.all.push(h);
 VS.updated=Date.now();
}
function commitRound(duel){ /* la ronda de votos termina cuando se sortea el duelo siguiente */
 const ids=Object.keys(VS.round);
 if(ids.length){
  const un=new Set(),votes={};
  ids.forEach(id=>{const r=VS.round[id];r.u.forEach(x=>un.add(x));votes[id]={votes:r.votes,uniqueUsers:r.u.length}});
  VS.rounds.push({t:Date.now(),duel:(duel||[]).slice(),votes,uniqueUsers:un.size});
  while(VS.rounds.length>MAX_ROUNDS)VS.rounds.shift();
 }
 VS.round={};VS.updated=Date.now();saveV(true);
}
const tname=id=>{try{const it=(typeof librePool==='function'&&librePool()[id])||tournamentItem(id);return it?it.n:id}catch(e){return id}};
const rows=m=>Object.keys(m).map(id=>({id,equipo:tname(id),votos:m[id].votes,usuariosUnicos:m[id].u.length})).sort((a,b)=>b.votos-a.votos||a.equipo.localeCompare(b.equipo));
const sum=m=>Object.values(m).reduce((a,r)=>a+r.votes,0);
function votesObj(){
 const ru=new Set();Object.values(VS.round).forEach(r=>r.u.forEach(x=>ru.add(x)));
 return{formato:'cluss-torneo-libre-votos',version:1,exportadoEn:iso(Date.now()),creadoEn:iso(VS.created),actualizadoEn:iso(VS.updated),
  privacidad:'Sin nombres de usuario. Los usuarios únicos se cuentan con huellas con sal que no se exportan.',
  resumen:{votosTotales:sum(VS.total),usuariosUnicos:VS.all.length,rondasRegistradas:VS.rounds.length},
  equipos:rows(VS.total),
  rondaActual:{votos:sum(VS.round),usuariosUnicos:ru.size,equipos:rows(VS.round)},
  rondas:VS.rounds.map(r=>({fecha:iso(r.t),duelo:r.duel.map(tname),usuariosUnicos:r.uniqueUsers,
   votos:Object.keys(r.votes).map(id=>({id,equipo:tname(id),votos:r.votes[id].votes,usuariosUnicos:r.votes[id].uniqueUsers}))}))};
}
/* enganche: al sortear el duelo siguiente se cierra la ronda de votos */
const _ld=libreDuel;
libreDuel=function(){const d=_ld.apply(this,arguments);try{commitRound(d)}catch(e){console.error(e)}return d};
/* tras recargar la pagina, la ronda de votos en curso sigue (menos los equipos que ya juegan) */
try{if(!Object.keys(libreVotes).length){const playing=new Set((typeof DUELO!=='undefined'?DUELO:[]).map(libreCanon));
 Object.keys(VS.round).forEach(id=>{if(!playing.has(id)&&VS.round[id].votes>0)libreVotes[id]=VS.round[id].votes})}}catch(e){}
window.libreArchive={vote,commitRound,flush:()=>saveV(true),data:votesObj};

/* ---------- ARCHIVO DE TEXTOS DEL CHAT (sin autor) ---------- */
/* BACKEND: los textos del chat YA NO se guardan en el cliente: cada texto se agrega al flujo chat-texts (POST /api/log/chat-texts). El cliente solo lleva un contador; el valor inicial sale de la clave de solo lectura cluss.chatArchive = {v,created,updated,trimmed,count} que el servidor puede incluir en /api/state.js. */
let CA=ld(K_C);
if(!CA||typeof CA!=='object'||CA.v!==1)CA={v:1,created:Date.now(),updated:Date.now(),trimmed:0,count:0};
CA=Object.assign({},CA,{count:+CA.count||0}); /* copia: el cliente nunca reenvia este documento */
const pendingChatRecords=[];
const saveC=now=>{if(now)SRV.flush(true)}; /* solo vacia la cola de envio al servidor */
function addChat(text){const t=String(text==null?'':text).replace(/\s+/g,' ').trim().slice(0,MAX_TXT);if(!t)return;pendingChatRecords.push([Date.now(),t]);CA.count++;CA.updated=Date.now()}
window.flushClussRoundPersistence=()=>{
 pendingChatRecords.forEach(record=>SRV.log('chat-texts',record));
 pendingChatRecords.length=0;
 if(window.libreArchive)window.libreArchive.flush();
 if(typeof window.persistTournamentRound==='function')window.persistTournamentRound();
 SRV.flush(true);
};
const SRVCHAT_JSON='/api/log/chat-texts.json',SRVCHAT_TXT='/api/log/chat-texts.txt'; /* BACKEND: descargas del archivo completo del chat, con Content-Disposition: attachment */
const chatJSON=()=>fetch(SRVCHAT_JSON).then(r=>r.text());
const chatTXT=()=>fetch(SRVCHAT_TXT).then(r=>r.text());
function clearChat(){pendingChatRecords.length=0;SRV.clearLog('chat-texts');CA.count=0;CA.trimmed=0;CA.created=CA.updated=Date.now()} /* BACKEND: DELETE /api/log/chat-texts */ /* SOLO la llama el boton confirmado */
const _hle=handleLiveEntry;
handleLiveEntry=function(e){try{if(e&&!e.bot&&e.type==='chat')addChat(e.content)}catch(x){console.error(x)}return _hle.apply(this,arguments)};
addEventListener('pagehide',()=>saveC(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveC(true)});

/* ---------- DESCARGA ---------- */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const dlVotes=()=>dl('torneo-libre-votos-'+stamp()+'.json',JSON.stringify(votesObj(),null,1),'application/json');
const dlSrv=(url,name)=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()};
const dlChatJSON=()=>dlSrv(SRVCHAT_JSON,'chat-textos-'+stamp()+'.json');
const dlChatTXT=()=>dlSrv(SRVCHAT_TXT,'chat-textos-'+stamp()+'.txt');

/* ---------- PANEL ---------- */
const app=document.getElementById('app')||document.body,p=document.createElement('div');
p.id='arch';p.hidden=true;p.setAttribute('role','dialog');p.setAttribute('aria-label','Archivos de votos y chat');
p.innerHTML='<header><b>🗂️ Archivos</b><button type="button" data-a="close" aria-label="Cerrar">✕</button></header>'
+'<section><h3>🗳️ Votos del Torneo Libre</h3><div id="arV"></div><ul id="arVl"></ul><div class="mut">Solo conteos: sin nombres de usuario.</div>'
+'<button type="button" data-a="votes">⬇ Votos (JSON)</button></section>'
+'<section><h3>💬 Textos del chat</h3><div id="arC"></div><div class="mut">Solo el texto y la hora: sin autor. Descargar no borra nada.</div>'
+'<button type="button" data-a="cjson">⬇ Chat (JSON)</button><button type="button" data-a="ctxt">⬇ Chat (TXT)</button></section>'
+'<section><h3>🗑️ Vaciar archivo del chat</h3><div id="arK"><button type="button" class="warn" data-a="ask">Vaciar archivo del chat…</button></div><div id="arM" class="mut"></div></section>';
app.appendChild(p);
const $a=s=>p.querySelector(s);let askT=0;
function stopAsk(){clearTimeout(askT);askT=0;$a('#arK').innerHTML='<button type="button" class="warn" data-a="ask">Vaciar archivo del chat…</button>'}
function paint(){
 if(p.hidden)return;
 const r=rows(VS.round).slice(0,5);
 $a('#arV').textContent='Votos: '+sum(VS.total)+' · Usuarios únicos: '+VS.all.length+' · Rondas: '+VS.rounds.length;
 $a('#arVl').innerHTML=r.length?r.map(x=>'<li>'+x.equipo.replace(/[<&]/g,'')+': '+x.votos+' voto'+(x.votos===1?'':'s')+' ('+x.usuariosUnicos+' usuario'+(x.usuariosUnicos===1?'':'s')+')</li>').join(''):'<li class="mut">Sin votos en la ronda actual</li>';
 $a('#arC').textContent='Textos archivados (en el servidor): '+CA.count;
}
function open(){p.hidden=false;stopAsk();$a('#arM').textContent='';paint()}
function close(){p.hidden=true;stopAsk()}
p.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,m=$a('#arM');
 if(a==='close')close();
 else if(a==='votes'){dlVotes();m.textContent='Votos descargados (el archivo se conserva).'}
 else if(a==='cjson'){dlChatJSON();m.textContent='Chat (JSON) descargado (el archivo se conserva).'}
 else if(a==='ctxt'){dlChatTXT();m.textContent='Chat (TXT) descargado (el archivo se conserva).'}
 else if(a==='ask'){$a('#arK').innerHTML='<div>¿Vaciar '+CA.count+' textos? No se puede deshacer.</div><button type="button" class="warn" data-a="yes">Sí, vaciar</button><button type="button" data-a="no">Cancelar</button>';askT=setTimeout(stopAsk,8000)}
 else if(a==='no')stopAsk();
 else if(a==='yes'){clearChat();stopAsk();m.textContent='Archivo del chat vaciado.'}
 paint()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!p.hidden)close()});
setInterval(paint,1000);
window.archivoCluss={open,close,votes:{vote,commitRound,obj:votesObj,json:()=>JSON.stringify(votesObj(),null,1),download:dlVotes},chat:{add:addChat,count:()=>CA.count,json:chatJSON,txt:chatTXT,clear:clearChat,downloadJSON:dlChatJSON,downloadTXT:dlChatTXT}};
})();
</script>

<!-- ===== GAMIFICACION Y EFECTOS (capa final, solo reacciona a eventos REALES; el bot nunca; no pide ni promete nada). Incluye: fanfarria de NIVEL, HINCHADA (ritmo de eventos en 8 s con 3 escalones), primer regalo de la ronda, lluvia de monedas con sacudida por regalo, y lineas de velocidad en el carril con TURBO. ===== -->
<style id="gami-v2">

<script>
(function(){
const F=window.fx;if(!F||!F.cannon||!F.FA)return;
const app=document.getElementById('app'),board=document.querySelector('.board'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const hot=document.createElement('div');hot.id='gmHot';hot.setAttribute('aria-hidden','true');app.appendChild(hot);
/* EVENTOS TOTALES en tiempo real dentro del cuadro de hinchada: suma de la franja de estadisticas (unidos + comentarios + regalos + me gusta + seguidores + compartidos), solo eventos reales */
const hotTxt=document.createElement('span'),hotTot=document.createElement('span'),hotNum=document.createElement('b');
hotTot.className='tot';hotTot.append('📊 EVENTOS TOTALES ',hotNum);hot.append(hotTxt,hotTot);
function updTot(){try{hotNum.textContent=Object.values(window.getLiveEventSnapshot().stats).reduce((a,b)=>a+(+b||0),0).toLocaleString('es-PY')}catch(e){}}
updTot();setInterval(()=>{if(hot.classList.contains('on'))updTot()},500);
const shake=()=>{if(!board||RM)return;board.classList.remove('shake');void board.offsetWidth;board.classList.add('shake')};
/* HINCHADA: eventos reales de los ultimos 8 s; 3 escalones, cada uno una vez por ronda con 20 s de enfriamiento */
const ev=[],TIERS=[[10,'🔥 HINCHADA CALIENTE','#ff8a1f'],[25,'⚡ HINCHADA EN LLAMAS','#ffd34d'],[50,'🌋 HINCHADA ÉPICA','#e11d48']];
let tierDone=-1,tierAt=0,hotT=0;
function pulse(){const now=Date.now();while(ev.length&&now-ev[0]>8000)ev.shift();return ev.length}
function onTier(i){
 const [,txt,col]=TIERS[i];F.banner(txt,col);F.FA.p(i===2?'champ':i===1?'comeback':'mile');
 F.burst(208,330,col,34,240);F.ring(208,330,col);
 if(i>=1){F.cannon(0,746,-62,18,680,16);F.cannon(416,746,-118,18,680,16)}
 if(i===2){F.flash('#ffb347');F.firework(208,200);shake()}
 hotTxt.textContent=txt;updTot();hot.style.borderColor=col;hot.classList.add('on');clearTimeout(hotT);hotT=setTimeout(()=>hot.classList.remove('on'),6000);
}
/* La hinchada reacciona a eventos que no son regalos. */
const _h=handleLiveEntry;
handleLiveEntry=function(e){
 const r=_h.apply(this,arguments);
 try{if(e&&!e.bot&&['chat','like','follow','share'].includes(e.type)){
  const w=e.type==='like'?Math.min(5,Math.max(1,+e.activityCount||1)):1;
  for(let k=0;k<w;k++)ev.push(Date.now());
  updTot();
  const n=pulse(),now=performance.now();
  if(now-tierAt>20000)for(let i=TIERS.length-1;i>tierDone;i--)if(n>=TIERS[i][0]){tierDone=i;tierAt=now;onTier(i);break}
  }}catch(x){console.error(x)}
 return r};
/* cada ronda nueva reinicia escalones */
const _r=reset;
reset=function(){tierDone=-1;tierAt=0;ev.length=0;hot.classList.remove('on');return _r.apply(this,arguments)};
})();
</script>

<script>
(function(){

if(!store||!foot||!app)return;

style.textContent=`
 #liveEventPanel{position:absolute;inset:0;z-index:210;padding:12px;background:#1b120a;color:#f3ece1;display:flex;flex-direction:column;gap:8px;font:12px/1.4 Inter,sans-serif}
 #liveEventPanel[hidden]{display:none}
 #liveEventPanel header{display:flex;justify-content:space-between;align-items:center;font-size:14px}
 #liveEventPanel header span{display:flex;gap:4px}
 #liveDiagnosticControls{display:flex;align-items:center;gap:6px;flex-shrink:0}
 #liveEventPanel button{font:700 12px Inter,sans-serif;color:#f3ece1;background:#3f2713;border:1px solid #6e4524;border-radius:999px;padding:5px 7px;cursor:pointer}
 #liveEventPanel button:disabled{opacity:.45;cursor:not-allowed}
 #liveEventPanel .connect{display:flex;gap:6px}
 #liveEventPanel input{flex:1;min-width:0;padding:8px;border:1px solid #8a6743;border-radius:8px;background:#2a190b;color:#fff;font:14px Inter,sans-serif}

 #liveEventList{flex:1;min-height:0;overflow:auto}

 #liveEventList summary{cursor:pointer;font-weight:700}
 #liveEventList pre{white-space:pre-wrap;overflow-wrap:anywhere;font:10px/1.4 ui-monospace,monospace;margin:6px 0;color:#d9c3a0}
 #liveEventList .empty{color:#a39a8b;padding:12px 2px}
`;
document.head.appendChild(style);
const panel=document.createElement('section');
panel.id='liveEventPanel';panel.hidden=true;panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-label','Conexión y eventos recibidos');
panel.innerHTML='<header><b>📨 Conexión y eventos <span id="liveEventCount">0</span></b><span><button id="clearLiveEvents" type="button">Limpiar</button><button id="closeLiveEvents" type="button" aria-label="Cerrar">✕</button></span></header><div id="liveDiagnosticControls"><button id="toggleLiveLog" type="button" aria-pressed="false" title="Capturar el recorrido detallado durante 10 minutos">🧪 Log</button><button id="copyLiveLog" type="button" aria-label="Copiar log" title="Copiar log" disabled>📋 Copiar</button></div><form class="connect"><input id="liveUsername" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Usuario de TikTok (sin @)" aria-label="Usuario de TikTok"><button id="connectLiveUser" type="submit">Conectar</button></form><div id="liveConnection" role="status" aria-live="polite">Esperando conexión…</div><div id="livePipeline" role="status" aria-live="polite"></div><div id="liveEventList" aria-live="polite"></div>';
app.appendChild(panel);
const input=panel.querySelector('#liveUsername'),form=panel.querySelector('form'),connection=panel.querySelector('#liveConnection'),list=panel.querySelector('#liveEventList');
const diagnosticButton=panel.querySelector('#toggleLiveLog'),copyLogButton=panel.querySelector('#copyLiveLog');
let editing=false;
function updateDiagnosticControls(){
 const diagnostic=store.getDiagnosticState(),remaining=diagnostic.active?Math.max(0,Math.ceil((Date.parse(diagnostic.expiresAt)-Date.now())/1000)):0;
 const clock=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;
 diagnosticButton.textContent=diagnostic.active?`🧪 ${clock}`:'🧪 Log';
 diagnosticButton.setAttribute('aria-pressed',String(diagnostic.active));
 diagnosticButton.title=diagnostic.active?`Registro activo; se apaga en ${clock}.`:'Capturar el recorrido detallado durante 10 minutos.';
 diagnosticButton.setAttribute('aria-label',diagnostic.active?`Desactivar registro detallado; quedan ${clock}`:'Activar registro detallado durante 10 minutos');
 copyLogButton.disabled=diagnostic.count===0;
 copyLogButton.title=diagnostic.count?`Copiar ${diagnostic.count} pasos del log`:'Activa el log temporal para capturar pasos';
}
function copyText(text){
 const textarea=document.createElement('textarea');
 textarea.value=text;textarea.setAttribute('readonly','');textarea.style.position='fixed';textarea.style.opacity='0';
 document.body.appendChild(textarea);textarea.select();
 const copied=typeof document.execCommand==='function'&&document.execCommand('copy');
 textarea.remove();
 if(!copied)throw new Error('El navegador no permitió copiar al portapapeles.');
}
async function copyDiagnosticLog(){
 const diagnostic=store.getDiagnosticLog();
 if(!diagnostic.entries.length){connection.textContent='No hay pasos registrados. Activa el log temporal para capturarlos.';return}
 try{
  const text=JSON.stringify(diagnostic,null,2);
  if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){
   try{await navigator.clipboard.writeText(text)}catch(error){copyText(text)}
  }else copyText(text);
  connection.textContent=`Log copiado (${diagnostic.entries.length} pasos).`;
 }catch(error){
  connection.textContent=`No se pudo copiar el log: ${error.message}`;
 }
}
function render(){
 const events=store.events;
 panel.querySelector('#liveEventCount').textContent=String(events.length);
 const updates=events.filter(item=>item.type==='update');
 const queued=updates.filter(item=>item.state==='queued').length;
 const processing=updates.filter(item=>item.state==='processing').length;
 const processed=updates.filter(item=>item.state==='processed').length;
 const errors=updates.filter(item=>item.state==='error').length;
 const diagnostic=store.getDiagnosticState();
 const diagnosticText=diagnostic.active?` · log detallado activo ${Math.ceil((Date.parse(diagnostic.expiresAt)-Date.now())/1000)}s`:'';
 panel.querySelector('#livePipeline').textContent=`LIVE recibidos: ${updates.length} · en cola: ${queued} · procesando: ${processing} · procesados: ${processed} · errores: ${errors}${diagnosticText}`;
 updateDiagnosticControls();
 const latestStatus=events.find(item=>item.type==='status');
 const latestConnection=events.find(item=>item.type==='status'||item.type==='connection');
 if(latestConnection){
  const state=latestConnection.payload,username=String(state.username||(latestStatus&&latestStatus.payload.username)||'').replace(/^@+/,'');
  if(username&&!editing&&document.activeElement!==input)input.value=username;
  const connected=Boolean(state.connected||state.isConnected);
  const stateText=connected?'Conectado':state.status==='connecting'||state.status==='reconnecting'?'Conectando':'Desconectado';
  connection.textContent=`${username?'@'+username+' · ':''}${state.error?'Error: '+state.error:stateText}`;
 }
 list.replaceChildren();
 if(!events.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Aún no se reciben eventos. Escribe el usuario del live y pulsa Conectar.';list.appendChild(empty);return}
 for(const item of events){
  const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');
  const eventType=item.payload&&item.payload.entry&&item.payload.entry.type;
  summary.textContent=`${item.time} · ${eventType||item.type}${item.state?' · '+item.state:''}`;
  const detail=item.type==='update'
   ?{eventId:item.eventId,state:item.state,reason:item.reason,error:item.error,lifecycle:item.lifecycle,result:item.result,payload:item.payload}
   :item.payload;
  pre.textContent=JSON.stringify(detail,null,2);
  details.append(summary,pre);list.appendChild(details);
 }
}
store.subscribe(()=>{if(!panel.hidden)render()});
setInterval(()=>{if(!panel.hidden)updateDiagnosticControls()},1000);
store.setSnapshotProvider(()=>window.getLiveEventSnapshot());
const registerLiveProcessor=()=>store.registerProcessor(entry=>handleLiveEntry(entry));
if(document.readyState==='complete')registerLiveProcessor();
else window.addEventListener('load',registerLiveProcessor,{once:true});
panel.querySelector('#closeLiveEvents').addEventListener('click',()=>{panel.hidden=true});
panel.querySelector('#clearLiveEvents').addEventListener('click',()=>store.clear());
diagnosticButton.addEventListener('click',()=>store.setDiagnosticMode(!store.getDiagnosticState().active));
copyLogButton.addEventListener('click',copyDiagnosticLog);
input.addEventListener('input',()=>{editing=true});
form.addEventListener('submit',async event=>{
 event.preventDefault();
 const username=input.value.trim().replace(/^@+/,'');
 if(!username){connection.textContent='Escribe un usuario de TikTok.';input.focus();return}
 const submit=form.querySelector('button[type="submit"]');
 submit.disabled=true;connection.textContent=`Solicitando conexión con @${username}…`;
 try{
  const response=await fetch('/api/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})});
  const result=await response.json();
  if(!response.ok||!result.ok)throw new Error(result.message||'No se pudo conectar con ese usuario.');
  input.value=result.username;editing=false;
  connection.textContent=`Conectando con @${result.username}…`;
 }catch(error){connection.textContent=error.message}
 finally{submit.disabled=false}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!panel.hidden)panel.hidden=true});
render();
})();
</script>

<style id="crono-regalos">

<script>
(function(){
 if(document.getElementById('cronoRegalos'))return;
 const w=document.createElement('div');w.id='cronoRegalos';
 const c=document.createElement('div');c.id='crono';c.setAttribute('role','timer');c.title='Tiempo con el overlay activo (hh:mm:ss)';
 const tx=document.createElement('span');tx.id='cronoTxt';tx.textContent='00:00:00';
 c.append(tx);
 const race=document.createElement('div');race.id='raceClock';race.setAttribute('role','timer');race.title='Tiempo transcurrido de la carrera actual';
 const raceIcon=document.createElement('span');raceIcon.textContent='🏁';raceIcon.setAttribute('aria-hidden','true');
 const raceTx=document.createElement('span');raceTx.id='raceClockTxt';raceTx.textContent='00:00';
 race.append(raceIcon,raceTx);
 const raceGroup=document.createElement('div');raceGroup.className='race-clock-group';
 const buttons=document.createElement('div');buttons.className='race-loop-buttons';
 const giftToggle=document.createElement('button');giftToggle.id='honorGiftToggle';giftToggle.type='button';giftToggle.textContent='⚽';giftToggle.title='Mostrar regalos de Honor';giftToggle.setAttribute('aria-label','Mostrar regalos de Honor');
 buttons.append(giftToggle);raceGroup.append(race,buttons);w.append(c,raceGroup);
 const ft=document.querySelector('#topbar .foot')||document.querySelector('.foot');if(ft)ft.appendChild(w);else document.getElementById('topbar').appendChild(w);
 let timerStartedAt=Date.now();
 const p=n=>String(n).padStart(2,'0');
 function tick(){const s=Math.max(0,Math.floor((Date.now()-timerStartedAt)/1000)),t=p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60);if(tx.textContent!==t){tx.textContent=t;c.setAttribute('aria-label','Tiempo activo '+t)}}
 function tickRace(){const s=Math.max(0,Math.floor(window.getRaceElapsedMs()/1000)),t=p(Math.floor(s/60))+':'+p(s%60);if(raceTx.textContent!==t){raceTx.textContent=t;race.setAttribute('aria-label','Duración de la carrera '+t)}}
 tick();tickRace();setInterval(()=>{tick();tickRace()},1000);
 const connectionButton=document.getElementById('connection');
 if(connectionButton)connectionButton.addEventListener('click',async()=>{
  if(connectionButton.disabled)return;
  connectionButton.disabled=true;
  try{
   const response=await fetch('/api/connect/next',{method:'POST',headers:{'X-Overlay-Control':'switch-user'}});
   const result=await response.json();
   if(!response.ok||result.ok!==true)throw new Error(result.message||`HTTP ${response.status}`);
   const username=String(result.username||'').trim().replace(/^@+/,'');
   if(!username)throw new Error('El backend no devolvió un usuario para conectar.');
   connectionButton.textContent='@'+username;
   connectionButton.title='Conectando a @'+username;
   connectionButton.setAttribute('aria-label',connectionButton.title+'; tocar para cambiar de usuario');
   toast('Conectando a @'+username,'👤');
  }catch(error){
   toast('No se pudo cambiar de usuario: '+error.message,'⚠️');
   console.error('No se pudo cambiar al siguiente usuario guardado.',error);
  }finally{setTimeout(()=>{connectionButton.disabled=false},1800)}
 });
 const toolsSource=new EventSource('/api/game-tools/events');
 const overlayClientId=window.crypto&&window.crypto.randomUUID
  ?window.crypto.randomUUID()
  :Date.now()+'-'+Math.random().toString(36).slice(2);
 function reportOverlayPresence(visible=!document.hidden){
  fetch('/api/game-tools/overlay-heartbeat',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({clientId:overlayClientId,visible}),keepalive:!visible,
  }).catch(error=>console.error('No se pudo reportar el estado del overlay.',error));
 }
 reportOverlayPresence();
 const overlayHeartbeat=setInterval(()=>reportOverlayPresence(),20000);
 document.addEventListener('visibilitychange',()=>reportOverlayPresence(!document.hidden));
 window.addEventListener('pagehide',()=>{clearInterval(overlayHeartbeat);reportOverlayPresence(false)});
 toolsSource.addEventListener('game-settings',event=>{
  try{
   const settings=JSON.parse(event.data);
   if(typeof window.setLiveTurboSettings==='function'){
    window.setLiveTurboSettings(settings.giftTurboProgress,settings.tapTurboProgress);
   }
   if(window.HonorBoard)window.HonorBoard.setTurbo(settings);
  }catch(error){console.error('No se pudieron actualizar los ajustes del juego desde el servidor.',error)}
 });
 toolsSource.addEventListener('game-tools',event=>{
  try{
   const state=JSON.parse(event.data);
   if(Number.isSafeInteger(state.timerStartedAt))timerStartedAt=state.timerStartedAt;
   tick();
  }catch(error){console.error('No se pudo actualizar el estado de herramientas del servidor.',error)}
 });
 toolsSource.addEventListener('vs-config',event=>{
  try{window.dispatchEvent(new CustomEvent('vs-config-update',{detail:JSON.parse(event.data)}))}
  catch(error){console.error('No se pudo actualizar la configuración de VS.',error)}
 });
 toolsSource.addEventListener('gift-config',event=>{
  try{window.dispatchEvent(new CustomEvent('gift-config-update',{detail:JSON.parse(event.data)}))}
  catch(error){console.error('No se pudo actualizar el catálogo de regalos.',error)}
 });
 toolsSource.addEventListener('voice-config',event=>{
  try{window.dispatchEvent(new CustomEvent('voice-config-update',{detail:JSON.parse(event.data)}))}
  catch(error){console.error('No se pudo actualizar el tiempo de antirrepetición de voz.',error)}
 });
 toolsSource.addEventListener('game-command',event=>{
  try{
   const {command}=JSON.parse(event.data);
   if(command==='refresh'){location.reload();return}
   const controls={'turbo-down':'bTurboDn','turbo-up':'bTurboUp'};
   const control=document.getElementById(controls[command]);
   if(control)control.click();
  }catch(error){console.error('No se pudo ejecutar el comando remoto.',error)}
 });
})();
</script>

 if(!e||e.bot||!W.hasOwnProperty(e.type))return;

 /* hitos colectivos del live (informan, no piden nada) */
 S.ev+=1;
 if(S.mile<MILES.length&&S.ev>=MILES[S.mile]){const n=MILES[S.mile++];safe(()=>FX.banner('🎉 '+n.toLocaleString('es')+' EVENTOS EN ESTE LIVE','#8be9ff'));sfx('champ')}
 let u=U.get(k);if(!u){u={rondas:0,ultima:0,chats:0,hitos:new Set()};U.set(k,u)}

<script id="tortu-esfuerzo-js">
(function(){
'use strict';
const safe=f=>{try{return f()}catch(e){return undefined}};
if(!safe(()=>T)||!window.MutationObserver)return;
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const HOLD=1800; /* ms que sigue haciendo fuerza despues del ultimo evento */
const L=[];
const lvl=i=>{const h=$('hb'+i);if(!h)return 0;
 if(h.classList.contains('full'))return 4; /* turbo del contador */
 const r=(+h.getAttribute('aria-valuenow')||0)/(+h.getAttribute('aria-valuemax')||1);
 return r>=.9?4:r>=.75?3:r>=.5?2:1};
const pos=i=>{const sv=$('sv'+i),t=$('in'+i);if(!sv||!t)return null;
 const s=sv.getBoundingClientRect(),r=t.getBoundingClientRect();if(!s.width||!s.height)return null;
 return{x:(r.left+r.width/2-s.left)/s.width*100,top:(r.top-s.top)/s.height*100,bot:(r.bottom-s.top)/s.height*100}};
function emit(i,txt,cls,where){
 if(RM)return;const p=pos(i),sv=$('sv'+i);if(!p||!sv)return;
 if(sv.querySelectorAll('.ef-p').length>8)return;
 const e=document.createElement('span');e.className='ef-p'+(cls?' '+cls:'');e.textContent=txt;
 e.style.left=(p.x+(Math.random()*14-7))+'%';e.style.top=(where==='head'?p.top+4:p.bot-4)+'%';
 e.style.setProperty('--dx',(Math.random()*30-15)+'px');
 sv.appendChild(e);setTimeout(()=>e.remove(),1000);
}
function bump(i,n){
 const s=L[i];if(!s)return;const lane=$('ln'+i);if(!lane)return;
 s.last=performance.now();
 if(n>=10){ /* comentario: empujon fuerte + globito */
  lane.classList.add('eff-c');clearTimeout(s.ct);s.ct=setTimeout(()=>lane.classList.remove('eff-c'),460);
  emit(i,'💬','ef-b','head');
 }else if(s.last-s.puff>140){ /* tap, like, seguir o compartir: polvo (fuego en la fase final) */
  s.puff=s.last;emit(i,lvl(i)>=4?'🔥':'💨');
 }
 paint(i);
}
function paint(i){
 const s=L[i],lane=$('ln'+i);if(!s||!lane)return;
 const on=!safe(()=>over)&&(performance.now()-s.last<HOLD||(($('hb'+i)||{}).classList||{contains:()=>false}).contains('full'));
 const v=on?lvl(i):0;
 if(v===s.v)return;s.v=v;
 lane.classList.toggle('eff',v>0);
 for(let k=1;k<=4;k++)lane.classList.toggle('eff'+k,k===v);

}
T.forEach((_,i)=>{

 new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(nd=>{ /* cada +N flotante = un evento real de tap (los +0 de reajuste no cuentan) */

 }))).observe(h,{childList:true});
});

<script id="aviso-cuenta-js">
(function(){
'use strict';
const safe=f=>{try{return f()}catch(e){return undefined}};
const MAX=3000; /* tope absoluto de cualquier aviso */
const $=id=>document.getElementById(id);
const hostOf=(el,sel)=>sel?(el.querySelector(sel)||el):el;
/* ventana, duracion real aproximada (ms), donde va el contador, como cerrarla si se pasa */
const TG=[];
document.querySelectorAll('#fxb span').forEach(s=>TG.push({el:s,ms:1750,on:e=>e.classList.contains('on'),close:e=>e.classList.remove('on')}));
[['toast',2200,null],['gmGift',2600,'.card'],['grChip',2600,null]].forEach(([id,ms,sel])=>{
 const el=$(id);if(el)TG.push({el,ms,host:sel,on:e=>e.classList.contains('on'),close:id==='gmGift'?null:(e=>e.classList.remove('on'))});
});
const hy=$('hype');if(hy)TG.push({el:hy,ms:2000,attr:'hidden',on:e=>!e.hidden,close:e=>{e.hidden=true}});
TG.forEach(g=>{
 let t0=0,iv=0,badge=null;
 const host=()=>g.host?(g.el.querySelector(g.host)||g.el):g.el;
 const stop=()=>{clearInterval(iv);iv=0;if(badge){badge.remove();badge=null}};
 function tick(){
  if(!g.on(g.el)){stop();return}
  const left=Math.min(g.ms,MAX)-(performance.now()-t0);
  if(performance.now()-t0>=MAX){if(g.close)g.close(g.el);stop();return}
  if(!badge||!badge.isConnected){badge=document.createElement('i');badge.className='gcd';badge.setAttribute('aria-hidden','true');host().appendChild(badge)}
  const s=Math.max(1,Math.ceil(left/1000));badge.textContent=s;badge.classList.toggle('u',s<=1);

 new MutationObserver(ms=>{
  if(ms.some(m=>g.attr?(m.oldValue!==null&&g.on(g.el)):(!(m.oldValue||'').split(/\s+/).includes('on')&&g.on(g.el))))start();
 }).observe(g.el,{attributes:true,attributeFilter:[g.attr||'class'],attributeOldValue:true});
